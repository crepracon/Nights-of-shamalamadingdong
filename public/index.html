<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nights of Shabalabadingdong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="hall">
    <header class="sign">
      <h1>Nights of<br />Shabalabadingdong</h1>
      <p class="sub">The Rusty Horse Inn &mdash; travelers welcome, mostly</p>
    </header>

    <!-- Join: sign the guest ledger -->
    <section id="join-view" class="ledger">
      <h2>Sign the ledger</h2>
      <div class="signing">
        <input id="name-input" type="text" maxlength="20"
               placeholder="Your name, traveler" autocomplete="off" />
        <button id="join-btn">Enter the inn</button>
      </div>
      <p id="join-error" class="error" hidden></p>
    </section>

    <!-- Lobby: who's in the room -->
    <section id="lobby-view" class="ledger" hidden>
      <h2>Tonight's guests</h2>
      <ul id="player-list"></ul>
      <p id="wait-note" class="note">Waiting for the innkeeper to open the taps&hellip;</p>
      <button id="start-btn" hidden>Begin the night</button>
      <p id="lobby-error" class="error" hidden></p>
    </section>

    <!-- Narration: the story unfolds, then the candles go out -->
    <section id="narration-view" class="ledger" hidden>
      <h2>Pay attention&hellip;</h2>
      <p id="narration-text" class="story"></p>
      <div class="timer-track"><div id="narration-timer" class="timer-fill"></div></div>
    </section>

    <!-- Question: candles are out, memory is tested -->
    <section id="question-view" class="ledger dark-room" hidden>
      <p id="question-count" class="note"></p>
      <h2 id="question-text"></h2>
      <div id="options" class="options"></div>
      <p id="locked-note" class="note" hidden>Answer locked. Eyes on the others&hellip;</p>
      <div class="timer-track"><div id="question-timer" class="timer-fill"></div></div>
    </section>

    <!-- Results: the scoreboard -->
    <section id="results-view" class="ledger" hidden>
      <h2>Last Orders &mdash; results</h2>
      <ol id="score-list"></ol>
      <button id="again-btn" hidden>Another round</button>
      <p class="note" id="results-note"></p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
